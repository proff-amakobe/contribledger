syntax = "proto3";
package contribledger.contrib.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "contribledger/x/contrib/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "contribledger/x/contrib/Params";
  option (gogoproto.equal) = true;
}

syntax = "proto3";

package contribledger.contrib.v1;

import "amino/amino.proto";
import "contribledger/contrib/v1/contribution.proto";
import "contribledger/contrib/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "contribledger/x/contrib/types";

// GenesisState defines the contrib module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Contribution contribution_map = 2 [(gogoproto.nullable) = false];
}

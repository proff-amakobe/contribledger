syntax = "proto3";
package contribledger.contribledger.v1;

import "amino/amino.proto";
import "contribledger/contribledger/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "contribledger/x/contribledger/types";

// GenesisState defines the contribledger module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
